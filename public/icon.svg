<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf0b0"/>
      <stop offset="1" stop-color="#22d3a8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- diagonal "side bet" line connecting two stake chips -->
  <g filter="url(#glow)">
    <path d="M348 676 L676 348" stroke="url(#mint)" stroke-width="58" stroke-linecap="round"/>
    <circle cx="348" cy="676" r="92" fill="url(#mint)"/>
    <circle cx="676" cy="348" r="92" fill="url(#mint)"/>
    <circle cx="348" cy="676" r="38" fill="#0b0f14"/>
    <circle cx="676" cy="348" r="38" fill="#0b0f14"/>
  </g>
</svg>
