<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>SideBet · Host</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="config.js"></script>
  <style>
    :root {
      --bg:#0b0f14; --surface:#141b23; --surface-2:#1b242e; --surface-3:#232f3b;
      --border:#28333f; --text:#eef2f6; --muted:#8a97a6; --muted-2:#5f6c7a;
      --accent:#34d399; --accent-ink:#04140d; --accent-glow:rgba(52,211,153,0.3);
      --pos:#34d399; --neg:#fb7185; --radius:16px; --radius-sm:11px;
      --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; padding-bottom:40px; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; background:radial-gradient(800px 400px at 80% -10%,var(--accent-glow),transparent 60%); }
    header { position:sticky; top:0; z-index:20; padding:calc(12px + var(--safe-top)) 18px 12px; display:flex; align-items:center; gap:10px;
      background:linear-gradient(180deg,rgba(11,15,20,0.94),rgba(11,15,20,0.6)); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
    .logo { display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.1rem; letter-spacing:-0.02em; }
    .logo .mark { width:28px; height:28px; }
    .host-tag { margin-left:auto; font-size:0.72rem; font-weight:700; color:var(--accent); background:var(--surface-2); border:1px solid var(--border); padding:5px 11px; border-radius:999px; text-transform:uppercase; letter-spacing:0.06em; }
    nav { position:sticky; top:0; z-index:15; display:flex; gap:4px; overflow-x:auto; padding:4px 12px 10px; scrollbar-width:none; background:var(--bg); }
    nav::-webkit-scrollbar { display:none; }
    nav button { flex:none; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); padding:9px 15px; border-radius:999px; font-size:0.82rem; font-weight:600; cursor:pointer; white-space:nowrap; }
    nav button.active { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
    main { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:6px 14px 0; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
    .card h2 { font-size:0.95rem; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
    .card h2 .tag { margin-left:auto; font-size:0.7rem; font-weight:600; color:var(--muted); }
    label { font-size:0.74rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:5px; }
    input, select { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 12px; color:var(--text); font-size:0.95rem; }
    input:focus, select:focus { outline:none; border-color:var(--accent); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .fg { margin-bottom:12px; }
    .btn { width:100%; padding:13px; border-radius:12px; border:none; cursor:pointer; font-size:0.92rem; font-weight:700; transition:transform 0.08s; }
    .btn:active { transform:scale(0.99); }
    .btn-primary { background:var(--accent); color:var(--accent-ink); }
    .btn-ghost { background:var(--surface-2); border:1px solid var(--border); color:var(--text); }
    .btn-danger { background:rgba(251,113,133,0.12); border:1px solid rgba(251,113,133,0.4); color:var(--neg); }
    .btn-sm { width:auto; padding:8px 13px; font-size:0.8rem; border-radius:9px; }
    .btn-row { display:flex; gap:8px; flex-wrap:wrap; }
    .btn-row .btn { flex:1; }
    .tmpl-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .tmpl { text-align:left; background:var(--surface-2); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:13px; cursor:pointer; color:var(--text); }
    .tmpl.sel { border-color:var(--accent); background:linear-gradient(180deg,var(--surface-3),var(--surface-2)); }
    .tmpl .e { font-size:1.6rem; }
    .tmpl .n { font-weight:700; margin-top:4px; }
    .tmpl .b { font-size:0.74rem; color:var(--muted); margin-top:2px; line-height:1.35; }
    .accent-row { display:flex; gap:8px; flex-wrap:wrap; }
    .swatch { width:34px; height:34px; border-radius:9px; cursor:pointer; border:2px solid transparent; }
    .swatch.sel { border-color:var(--text); }
    .listitem { display:flex; align-items:center; gap:11px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; }
    .listitem .ava { width:38px; height:38px; flex:none; border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:1.25rem; }
    .listitem .mid { flex:1; min-width:0; }
    .listitem .mid .t { font-weight:700; font-size:0.92rem; }
    .listitem .mid .s { font-size:0.74rem; color:var(--muted); }
    .listitem .acts { display:flex; gap:6px; }
    .icon-btn { width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface-3); color:var(--muted); cursor:pointer; font-size:0.95rem; display:flex; align-items:center; justify-content:center; }
    .icon-btn.danger { color:var(--neg); }
    .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
    .pill.open { background:rgba(52,211,153,0.15); color:var(--pos); }
    .pill.closed { background:#3a2a14; color:#f5b860; }
    .pill.settled { background:#2a1f3d; color:#c39bf5; }
    .pill.setup { background:var(--surface-3); color:var(--muted); }
    .msg { padding:10px 13px; border-radius:10px; font-size:0.84rem; margin-bottom:12px; }
    .msg.ok { background:rgba(52,211,153,0.12); color:var(--pos); }
    .msg.err { background:rgba(251,113,133,0.12); color:var(--neg); }
    .empty { text-align:center; color:var(--muted); padding:30px 16px; font-size:0.88rem; }
    .empty .e { font-size:2.4rem; margin-bottom:8px; }
    .market-admin { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px; margin-bottom:10px; }
    .market-admin .mh { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .market-admin .mh .nm { font-weight:700; }
    .market-admin .mh .ty { font-size:0.68rem; color:var(--muted); background:var(--surface-3); padding:2px 7px; border-radius:6px; }
    .rank-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .rank-row .num { width:26px; height:26px; flex:none; border-radius:7px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; color:var(--muted); }
    .rank-row select { flex:1; }
    .toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(18px); z-index:60; background:var(--accent); color:var(--accent-ink); font-weight:700; padding:11px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:all 0.28s; font-size:0.88rem; }
    .toast.show { opacity:1; transform:translateX(-50%); }
    .toast.err { background:var(--neg); color:#2a0a10; }
    .check { display:flex; align-items:center; gap:9px; padding:9px 11px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; margin-bottom:6px; cursor:pointer; }
    .check input { width:auto; }
    .hint { font-size:0.74rem; color:var(--muted-2); margin-top:8px; line-height:1.45; }
    /* PIN overlay */
    .overlay { position:fixed; inset:0; z-index:100; background:rgba(7,10,14,0.86); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; padding:24px; }
    .overlay .box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; max-width:320px; width:100%; }
    .overlay h2 { display:flex; align-items:center; gap:8px; font-size:1.05rem; margin-bottom:14px; }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <svg class="mark" viewBox="0 0 32 32" fill="none">
      <rect x="2" y="2" width="28" height="28" rx="9" fill="var(--accent)"/>
      <path d="M10.5 21.5L21.5 10.5" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="12.4" cy="11.4" r="2.1" fill="var(--accent-ink)"/><circle cx="19.6" cy="20.6" r="2.1" fill="var(--accent-ink)"/>
    </svg>
    <span>SideBet</span>
  </div>
  <span class="host-tag">Host</span>
</header>
<nav id="nav">
  <button data-tab="event" class="active" onclick="switchTab('event')">Event</button>
  <button data-tab="contestants" onclick="switchTab('contestants')">Contestants</button>
  <button data-tab="markets" onclick="switchTab('markets')">Pools</button>
  <button data-tab="settle" onclick="switchTab('settle')">Settle</button>
</nav>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
let data = null;            // active event snapshot from /api/event
let templates = [];
let activeTab = 'event';
let newTemplate = 'racing';
let newAccent = 'emerald';

const PIN_KEY = 'sidebetPin';
const ACCENTS = { emerald:'#34d399', cyan:'#22d3ee', violet:'#a78bfa', rose:'#fb7185', amber:'#fbbf24', blue:'#60a5fa' };
const ACCENT_INK = { emerald:'#04140d', cyan:'#04181c', violet:'#150a26', rose:'#2a0a10', amber:'#241803', blue:'#06182e' };
const TYPE_LABEL = { win:'Winner takes pool', topn:'Top N share', h2h:'Head to head' };

function getPin() { return sessionStorage.getItem(PIN_KEY) || ''; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n) { const c = data&&data.event?data.event.currency:'$'; return c + Number(n).toFixed(2); }
function applyAccent(k) { const r=document.documentElement.style; r.setProperty('--accent',ACCENTS[k]||ACCENTS.emerald); r.setProperty('--accent-ink',ACCENT_INK[k]||'#04140d'); }
function toast(m, err) { const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2200); }

async function api(method, url, body) {
  const pin = getPin();
  const opts = { method, headers: { 'Content-Type':'application/json' } };
  if (pin) opts.headers['X-Admin-Pin'] = pin;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch((window.API_BASE||'') + url, opts);
  const j = await r.json();
  if (r.status === 401) { sessionStorage.removeItem(PIN_KEY); showPin(); throw new Error('PIN required'); }
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

// ─── PIN gate ───────────────────────────────────────────────────────────────
function showPin() {
  if (document.getElementById('pinOverlay')) return;
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="pinOverlay">
      <div class="box">
        <h2>🔒 Host PIN</h2>
        <div id="pinMsg"></div>
        <div class="fg"><input id="pinInput" type="password" inputmode="numeric" placeholder="Enter PIN" autocomplete="off"></div>
        <button class="btn btn-primary" onclick="submitPin()">Unlock</button>
        <div class="hint">Set the <code>ADMIN_PIN</code> env var on your server to enable this. Leave it unset for open access during local testing.</div>
      </div>
    </div>`);
  setTimeout(() => { const i=document.getElementById('pinInput'); if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')submitPin();});} }, 50);
}
async function submitPin() {
  const pin = document.getElementById('pinInput').value;
  try {
    const r = await fetch((window.API_BASE||'') + '/api/admin/events', { headers: { 'X-Admin-Pin': pin } });
    if (r.status === 401) { document.getElementById('pinMsg').innerHTML = `<div class="msg err">Incorrect PIN</div>`; return; }
    sessionStorage.setItem(PIN_KEY, pin);
    document.getElementById('pinOverlay').remove();
    boot();
  } catch (e) { sessionStorage.setItem(PIN_KEY, pin); document.getElementById('pinOverlay').remove(); boot(); }
}

// ─── Load ───────────────────────────────────────────────────────────────────
async function load() {
  data = await api('GET', '/api/event');
  if (data.event) applyAccent(data.event.accent);
  renderTab();
}
function switchTab(t) { activeTab = t; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); renderTab(); }
function renderTab() { ({ event:renderEvent, contestants:renderContestants, markets:renderMarkets, settle:renderSettle }[activeTab] || renderEvent)(); }

// ─── Event tab ──────────────────────────────────────────────────────────────
function renderEvent() {
  const ev = data && data.event;
  const v = document.getElementById('view');
  if (!ev) {
    v.innerHTML = createEventForm();
    syncTemplatePick();
    return;
  }
  const statusPill = `<span class="pill ${ev.status}">${ev.status}</span>`;
  v.innerHTML = `
    <div class="card">
      <h2>Current event ${statusPill}</h2>
      <div class="grid2">
        <div class="fg"><label>Name</label><input id="eName" value="${esc(ev.name)}"></div>
        <div class="fg"><label>Emoji</label><input id="eEmoji" value="${esc(ev.emoji)}" maxlength="4"></div>
      </div>
      <div class="grid2">
        <div class="fg"><label>Venue</label><input id="eVenue" value="${esc(ev.venue)}"></div>
        <div class="fg"><label>Date</label><input id="eDate" value="${esc(ev.date)}" placeholder="Sat Jun 14"></div>
      </div>
      <div class="grid3">
        <div class="fg"><label>Currency</label><input id="eCur" value="${esc(ev.currency)}" maxlength="3"></div>
        <div class="fg"><label>Min bet</label><input id="eMin" type="number" value="${ev.min_bet}" min="0"></div>
        <div class="fg"><label>House cut %</label><input id="eRake" type="number" value="${ev.rake_pct}" min="0" max="50"></div>
      </div>
      <div class="fg"><label>Accent</label><div class="accent-row" id="editAccent"></div></div>
      <button class="btn btn-ghost" onclick="saveEvent()">Save changes</button>
    </div>

    <div class="card">
      <h2>Betting control</h2>
      <div class="btn-row">
        ${ev.status !== 'open' ? `<button class="btn btn-primary" onclick="setStatus('open')">▶ Open betting</button>` : `<button class="btn btn-ghost" onclick="setStatus('closed')">⏸ Close betting</button>`}
      </div>
      <div class="hint">Open lets guests place bets. Close freezes all pools. Settle individual pools in the Settle tab to pay out.</div>
    </div>

    <div class="card">
      <h2>Danger zone</h2>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="resetEvent()">↺ Clear all bets</button>
        <button class="btn btn-danger" onclick="deleteEvent(${ev.id})">🗑 Delete event</button>
      </div>
      <div class="hint">Clearing wipes every bet & result but keeps contestants and pools. Deleting removes the event entirely and a fresh one can be created.</div>
    </div>`;
  renderAccentRow('editAccent', ev.accent, k => api('PUT','/api/admin/event',{accent:k}).then(()=>{applyAccent(k);load();}));
}

function createEventForm() {
  return `
    <div class="card">
      <h2>✨ New event</h2>
      <div class="fg"><label>Start from a template</label>
        <div class="tmpl-grid" id="tmplGrid">
          ${templates.map(t => `<button class="tmpl" data-id="${t.id}" onclick="pickTemplate('${t.id}','${t.accent}')">
            <div class="e">${t.emoji}</div><div class="n">${esc(t.label)}</div><div class="b">${esc(t.blurb)}</div></button>`).join('')}
        </div>
      </div>
      <div class="grid2">
        <div class="fg"><label>Event name</label><input id="cName" placeholder="Saturday Dog Dash"></div>
        <div class="fg"><label>Venue</label><input id="cVenue" placeholder="The backyard"></div>
      </div>
      <div class="grid3">
        <div class="fg"><label>Date</label><input id="cDate" placeholder="Sat Jun 14"></div>
        <div class="fg"><label>Currency</label><input id="cCur" value="$" maxlength="3"></div>
        <div class="fg"><label>Min bet</label><input id="cMin" type="number" value="1" min="0"></div>
      </div>
      <div class="fg"><label>Accent</label><div class="accent-row" id="createAccent"></div></div>
      <button class="btn btn-primary" onclick="createEvent()">Create event</button>
      <div class="hint">Templates seed example contestants and pools so you're ready in seconds — edit or delete anything after.</div>
    </div>`;
}
function pickTemplate(id, accent) { newTemplate = id; newAccent = accent; syncTemplatePick(); renderAccentRow('createAccent', newAccent, k=>{newAccent=k;syncTemplatePick();}); }
function syncTemplatePick() {
  document.querySelectorAll('#tmplGrid .tmpl').forEach(b => b.classList.toggle('sel', b.dataset.id === newTemplate));
  renderAccentRow('createAccent', newAccent, k=>{newAccent=k;});
}
function renderAccentRow(id, current, onPick) {
  const el = document.getElementById(id); if (!el) return;
  el.innerHTML = Object.entries(ACCENTS).map(([k,hex]) => `<div class="swatch ${k===current?'sel':''}" data-k="${k}" style="background:${hex}"></div>`).join('');
  el.querySelectorAll('.swatch').forEach(s => s.onclick = () => { el.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); onPick(s.dataset.k); });
}
async function createEvent() {
  const name = document.getElementById('cName').value.trim();
  if (!name) return toast('Give it a name', true);
  try {
    await api('POST', '/api/admin/event', {
      name, template: newTemplate, accent: newAccent,
      venue: document.getElementById('cVenue').value.trim(),
      date: document.getElementById('cDate').value.trim(),
      currency: document.getElementById('cCur').value.trim() || '$',
      min_bet: parseFloat(document.getElementById('cMin').value) || 1,
    });
    toast('Event created 🎉');
    await load();
  } catch (e) { toast(e.message, true); }
}
async function saveEvent() {
  try {
    await api('PUT', '/api/admin/event', {
      name: document.getElementById('eName').value.trim(),
      emoji: document.getElementById('eEmoji').value.trim(),
      venue: document.getElementById('eVenue').value.trim(),
      date: document.getElementById('eDate').value.trim(),
      currency: document.getElementById('eCur').value.trim() || '$',
      min_bet: parseFloat(document.getElementById('eMin').value) || 1,
      rake_pct: parseFloat(document.getElementById('eRake').value) || 0,
    });
    toast('Saved');
    await load();
  } catch (e) { toast(e.message, true); }
}
async function setStatus(s) { try { await api('POST','/api/admin/event/status',{status:s}); toast(s==='open'?'Betting open ▶':'Betting closed'); await load(); } catch(e){ toast(e.message,true);} }
async function resetEvent() { if(!confirm('Clear all bets and results? Contestants and pools stay.'))return; try{ await api('POST','/api/admin/event/reset'); toast('Bets cleared'); await load(); }catch(e){toast(e.message,true);} }
async function deleteEvent(id) { if(!confirm('Delete this event entirely? This cannot be undone.'))return; try{ await api('DELETE','/api/admin/event/'+id); toast('Event deleted'); await load(); }catch(e){toast(e.message,true);} }

// ─── Contestants tab ──────────────────────────────────────────────────────────
function renderContestants() {
  const v = document.getElementById('view');
  if (!data.event) { v.innerHTML = noEvent(); return; }
  const cs = data.contestants || [];
  v.innerHTML = `
    <div class="card">
      <h2>Add contestant</h2>
      <div class="grid2">
        <div class="fg"><label>Emoji</label><input id="ncEmoji" placeholder="🐕" maxlength="4"></div>
        <div class="fg"><label>Name</label><input id="ncName" placeholder="Rocket"></div>
      </div>
      <div class="fg"><label>Subtitle (optional)</label><input id="ncSub" placeholder="Lane 1 · 3yo greyhound"></div>
      <button class="btn btn-primary" onclick="addContestant()">Add contestant</button>
    </div>
    <div class="card">
      <h2>Lineup <span class="tag">${cs.length}</span></h2>
      ${cs.length ? cs.map(c => `
        <div class="listitem">
          <div class="ava">${c.emoji||esc(c.name[0].toUpperCase())}</div>
          <div class="mid"><div class="t">${esc(c.name)}</div>${c.subtitle?`<div class="s">${esc(c.subtitle)}</div>`:''}</div>
          <div class="acts">
            <button class="icon-btn" onclick="editContestant(${c.id})">✎</button>
            <button class="icon-btn danger" onclick="delContestant(${c.id})">🗑</button>
          </div>
        </div>`).join('') : '<div class="empty"><div class="e">🐾</div>No contestants yet. Add a few above.</div>'}
    </div>`;
}
async function addContestant() {
  const name = document.getElementById('ncName').value.trim();
  if (!name) return toast('Name required', true);
  try {
    await api('POST','/api/admin/contestant',{ name, emoji:document.getElementById('ncEmoji').value.trim(), subtitle:document.getElementById('ncSub').value.trim() });
    toast('Added '+name); await load();
  } catch(e){ toast(e.message,true); }
}
async function editContestant(id) {
  const c = data.contestants.find(x=>x.id===id);
  const name = prompt('Name:', c.name); if (name===null) return;
  const emoji = prompt('Emoji:', c.emoji); if (emoji===null) return;
  const subtitle = prompt('Subtitle:', c.subtitle); if (subtitle===null) return;
  try { await api('PUT','/api/admin/contestant/'+id,{ name:name.trim(), emoji:emoji.trim(), subtitle:subtitle.trim() }); toast('Updated'); await load(); } catch(e){ toast(e.message,true); }
}
async function delContestant(id) { if(!confirm('Remove this contestant and any bets on them?'))return; try{ await api('DELETE','/api/admin/contestant/'+id); toast('Removed'); await load(); }catch(e){toast(e.message,true);} }

// ─── Markets (pools) tab ──────────────────────────────────────────────────────
function renderMarkets() {
  const v = document.getElementById('view');
  if (!data.event) { v.innerHTML = noEvent(); return; }
  const cs = data.contestants || [];
  const markets = data.markets || [];
  v.innerHTML = `
    <div class="card">
      <h2>New pool</h2>
      <div class="fg"><label>Pool name</label><input id="nmName" placeholder="Win · Race 2 · Best Dressed"></div>
      <div class="grid2">
        <div class="fg"><label>Type</label>
          <select id="nmType" onchange="onTypeChange()">
            <option value="win">Winner takes pool</option>
            <option value="topn">Top N share</option>
            <option value="h2h">Head to head</option>
          </select>
        </div>
        <div class="fg" id="topNWrap" style="display:none"><label>How many places (N)</label><input id="nmTopN" type="number" value="3" min="2"></div>
      </div>
      <div class="fg" id="subsetWrap" style="display:none">
        <label>Eligible contestants</label>
        <div id="subsetList">${cs.map(c=>`<label class="check"><input type="checkbox" value="${c.id}"> ${c.emoji||''} ${esc(c.name)}</label>`).join('')}</div>
        <div class="hint">Leave all unchecked to include everyone. For head-to-head, pick exactly the contenders.</div>
      </div>
      <button class="btn btn-primary" onclick="addMarket()">Create pool</button>
    </div>
    <div class="card">
      <h2>Pools <span class="tag">${markets.length}</span></h2>
      ${markets.length ? markets.map(marketAdminCard).join('') : '<div class="empty"><div class="e">🎯</div>No pools yet. Create one above.</div>'}
    </div>`;
  onTypeChange();
}
function marketAdminCard(mk) {
  const cMap = {}; for (const c of (data.contestants||[])) cMap[c.id] = c;
  const isLine = mk.pricing === 'line';
  const statusPill = `<span class="pill ${mk.status}">${mk.status}</span>`;
  const priceBadge = `<span class="ty">${isLine ? '⚡ Fixed odds' : 'Pool'}</span>`;
  const toggle = mk.status === 'settled' ? `<button class="btn btn-ghost btn-sm" onclick="reopenMarket(${mk.id})">Reopen</button>`
    : mk.status === 'open' ? `<button class="btn btn-ghost btn-sm" onclick="marketStatus(${mk.id},'closed')">Close</button>`
    : `<button class="btn btn-ghost btn-sm" onclick="marketStatus(${mk.id},'open')">Open</button>`;

  const canLine = (mk.type === 'win' || mk.type === 'h2h');
  const amerMap = {}; (mk.lines || []).forEach(l => { if (l.decimal != null) amerMap[l.contestant_id] = l.odds; });
  const lineEditor = !canLine ? '' : `
    <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="toggleLineEditor(${mk.id})">⚡ ${isLine ? 'Edit odds line' : 'Set odds line'}</button>
    <div id="lineEditor_${mk.id}" style="display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px">
      <div class="hint" style="margin-top:0;margin-bottom:8px">Paste the book's American odds for each side. SideBet strips the juice; bets pay these fair odds and match against each other.</div>
      ${mk.eligible.map(cid => { const c = cMap[cid]; return `<div class="fg"><label>${c ? (c.emoji + ' ' + esc(c.name)) : cid}</label><input id="line_${mk.id}_${cid}" type="number" inputmode="numeric" placeholder="e.g. -150" value="${amerMap[cid] != null ? amerMap[cid] : ''}"></div>`; }).join('')}
      <div id="linePrev_${mk.id}" style="font-size:0.8rem;color:var(--muted);margin:4px 0 10px"></div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" onclick="previewLine(${mk.id})">Preview de-vig</button>
        <button class="btn btn-primary btn-sm" onclick="saveLine(${mk.id})">Save fair line</button>
        ${isLine ? `<button class="btn btn-ghost btn-sm" onclick="setPricingPool(${mk.id})">Back to pool</button>` : ''}
      </div>
    </div>`;

  return `<div class="market-admin">
    <div class="mh"><span class="nm">${esc(mk.name)}</span>${priceBadge}<span class="ty">${TYPE_LABEL[mk.type]}${mk.type==='topn'?' ('+mk.top_n+')':''}</span>${statusPill}</div>
    <div style="font-size:0.78rem;color:var(--muted);margin-bottom:10px">${money(mk.pool)} ${isLine?'at stake':'in pool'} · ${(mk.bets||[]).length} bets · ${mk.eligible.length} eligible</div>
    <div class="btn-row">${toggle}<button class="btn btn-danger btn-sm" onclick="delMarket(${mk.id})">Delete</button></div>
    ${lineEditor}
  </div>`;
}
function collectLineOdds(mid) {
  const odds = {};
  document.querySelectorAll(`[id^="line_${mid}_"]`).forEach(inp => {
    const cid = inp.id.split('_').pop();
    if (inp.value !== '' && !isNaN(Number(inp.value)) && Number(inp.value) !== 0) odds[cid] = Number(inp.value);
  });
  return odds;
}
function toggleLineEditor(mid) { const el = document.getElementById('lineEditor_' + mid); el.style.display = el.style.display === 'none' ? '' : 'none'; }
async function previewLine(mid) {
  const odds = collectLineOdds(mid);
  if (Object.keys(odds).length < 2) return toast('Enter odds for at least two', true);
  try {
    const r = await api('POST', `/api/admin/market/${mid}/lines`, { odds, format: 'american', preview: true });
    const cMap = {}; for (const c of (data.contestants||[])) cMap[c.id] = c;
    document.getElementById('linePrev_' + mid).innerHTML = 'Fair odds → ' + r.lines.map(l =>
      `${cMap[l.contestant_id] ? esc(cMap[l.contestant_id].name) : l.contestant_id}: <strong style="color:var(--accent)">${l.american > 0 ? '+' + l.american : l.american}</strong> (${l.trueProb}%)`).join(' · ');
  } catch (e) { toast(e.message, true); }
}
async function saveLine(mid) {
  const odds = collectLineOdds(mid);
  if (Object.keys(odds).length < 2) return toast('Enter odds for at least two', true);
  try { await api('POST', `/api/admin/market/${mid}/lines`, { odds, format: 'american' }); toast('Fair line saved ⚡'); await load(); } catch (e) { toast(e.message, true); }
}
async function setPricingPool(mid) {
  if (!confirm('Switch this pool back to pari-mutuel? The fixed line will be removed.')) return;
  try { await api('POST', `/api/admin/market/${mid}/pricing`, { pricing: 'pool' }); toast('Switched to pool'); await load(); } catch (e) { toast(e.message, true); }
}
function onTypeChange() {
  const t = document.getElementById('nmType'); if (!t) return;
  document.getElementById('topNWrap').style.display = t.value === 'topn' ? '' : 'none';
  document.getElementById('subsetWrap').style.display = t.value === 'h2h' ? '' : 'none';
}
async function addMarket() {
  const name = document.getElementById('nmName').value.trim();
  if (!name) return toast('Pool name required', true);
  const type = document.getElementById('nmType').value;
  const body = { name, type };
  if (type === 'topn') body.top_n = parseInt(document.getElementById('nmTopN').value) || 3;
  if (type === 'h2h') {
    body.contestant_ids = [...document.querySelectorAll('#subsetList input:checked')].map(i=>parseInt(i.value));
    if (body.contestant_ids.length < 2) return toast('Pick at least 2 contenders', true);
  }
  try { await api('POST','/api/admin/market',body); toast('Pool created'); await load(); } catch(e){ toast(e.message,true); }
}
async function marketStatus(id,s) { try{ await api('POST','/api/admin/market/'+id+'/status',{status:s}); toast('Pool '+s); await load(); }catch(e){toast(e.message,true);} }
async function reopenMarket(id) { if(!confirm('Reopen this pool? Its result will be cleared.'))return; try{ await api('POST','/api/admin/market/'+id+'/reopen'); toast('Reopened'); await load(); }catch(e){toast(e.message,true);} }
async function delMarket(id) { if(!confirm('Delete this pool and its bets?'))return; try{ await api('DELETE','/api/admin/market/'+id); toast('Deleted'); await load(); }catch(e){toast(e.message,true);} }

// ─── Settle tab ───────────────────────────────────────────────────────────────
function renderSettle() {
  const v = document.getElementById('view');
  if (!data.event) { v.innerHTML = noEvent(); return; }
  const cMap = {}; for (const c of (data.contestants||[])) cMap[c.id] = c;
  const markets = data.markets || [];
  const live = markets.filter(m => m.status !== 'settled');
  const done = markets.filter(m => m.status === 'settled');

  let html = `<div class="card"><h2>Settle pools</h2><div class="hint">Enter the finishing order, then settle to lock in payouts. Winners split the pool by stake. Use Push to refund everyone.</div></div>`;

  if (!markets.length) { v.innerHTML = html + `<div class="card"><div class="empty"><div class="e">🎯</div>No pools to settle.</div></div>`; return; }

  html += live.map(mk => {
    const places = mk.type === 'topn' ? mk.top_n : 1;
    const opts = mk.eligible.map(cid => { const c = cMap[cid]; return `<option value="${cid}">${c?(c.emoji+' '+c.name):cid}</option>`; }).join('');
    const rankRows = Array.from({length:places}, (_,i) => `
      <div class="rank-row"><div class="num">${i+1}</div>
        <select id="rank_${mk.id}_${i}"><option value="">— pick —</option>${opts}</select></div>`).join('');
    return `<div class="card">
      <h2>${esc(mk.name)} <span class="pill ${mk.status}">${mk.status}</span></h2>
      <div style="font-size:0.8rem;color:var(--muted);margin-bottom:12px">${money(mk.pool)} pool · ${(mk.bets||[]).length} bets</div>
      ${rankRows}
      <div class="btn-row" style="margin-top:10px">
        <button class="btn btn-primary" onclick="settleMarket(${mk.id},${places})">Settle & pay out</button>
        <button class="btn btn-ghost" onclick="pushMarket(${mk.id})">Push (refund)</button>
      </div>
    </div>`;
  }).join('');

  if (done.length) {
    html += `<div class="card"><h2>Settled <span class="tag">${done.length}</span></h2>` + done.map(mk => {
      const winners = (mk.results||[]).filter(r=>r.rank<=(mk.type==='topn'?mk.top_n:1)).map(r=>cMap[r.contestant_id]).filter(Boolean);
      const label = mk.is_push ? 'Push — refunded' : winners.map(c=>`${c.emoji||''} ${esc(c.name)}`).join(', ');
      return `<div class="listitem"><div class="ava">🏆</div><div class="mid"><div class="t">${esc(mk.name)}</div><div class="s">${label} · ${money(mk.pool)}</div></div>
        <button class="icon-btn" onclick="reopenMarket(${mk.id})">↺</button></div>`;
    }).join('') + `</div>`;
  }
  v.innerHTML = html;
}
async function settleMarket(id, places) {
  const ranks = [];
  for (let i=0;i<places;i++) {
    const sel = document.getElementById(`rank_${id}_${i}`);
    if (sel && sel.value) ranks.push({ contestant_id: parseInt(sel.value), rank: i+1 });
  }
  if (!ranks.length) return toast('Pick at least the winner', true);
  const ids = ranks.map(r=>r.contestant_id);
  if (new Set(ids).size !== ids.length) return toast('Each place must be a different contestant', true);
  try { await api('POST','/api/admin/market/'+id+'/result',{ ranks }); toast('Settled & paid out 🏆'); await load(); } catch(e){ toast(e.message,true); }
}
async function pushMarket(id) { if(!confirm('Push this pool? Everyone gets refunded.'))return; try{ await api('POST','/api/admin/market/'+id+'/result',{is_push:true}); toast('Pushed — refunded'); await load(); }catch(e){toast(e.message,true);} }

function noEvent() { return `<div class="card"><div class="empty"><div class="e">✨</div>Create an event in the Event tab first.</div></div>`; }

// ─── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  try { templates = await api('GET', '/api/templates'); } catch(e) { return; }
  await load();
  setInterval(() => { if (activeTab==='markets'||activeTab==='settle') load().catch(()=>{}); }, 9000);
}
boot();
</script>
</body>
</html>
